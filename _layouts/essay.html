---
layout: default
---
<article>
  <header class="essay-header">
    {%- if page.date_label %}
    <p class="kicker essay-date">{{ page.date_label }}</p>
    {%- endif %}
    <h1 class="essay-title">{{ page.title }}</h1>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <p class="essay-end" aria-hidden="true">&middot; &middot; &middot;</p>
</article>
